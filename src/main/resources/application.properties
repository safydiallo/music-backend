spring.application.name=music

# Base de données
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# JPA / Hibernate
spring.jpa.database-platform=${PERSISTENCE_PLATFORM}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from.address=${MAIL_FROM_ADDRESS:noreply@musique-zig.com}
app.mail.from.name=${MAIL_FROM_NAME:Musique-Zig}

# URL
app.base-url=${APP_BASE_URL}
app.frontend-url=${FRONTEND_URL}
app.allowed-origin=${ALLOWED_ORIGIN}

# Admin par défaut
app.admin.email=${ADMIN_EMAIL:admin@musiquezig.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.fullname=${ADMIN_FULLNAME:Administrateur}
app.mail.from.name=${MAIL_FROM_NAME:Musique-Zig}

#API GOOGLE
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

#Utilisation de Redis pour le stockage des tokens de rafraîchissement
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Upload de fichiers (photo de profil + audio WAV)
# Limite globale relevée à 200 Mo pour les fichiers audio WAV non compressés ;
# la photo de profil reste plafonnée à 5 Mo par sa propre validation dans FileStorageService.
app.upload.dir=${UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ISRC (généré automatiquement par piste)
app.isrc.country-code=${ISRC_COUNTRY_CODE:SN}
app.isrc.registrant-code=${ISRC_REGISTRANT_CODE:MZG}

# Validation audio
app.audio.min-sample-rate=${AUDIO_MIN_SAMPLE_RATE:44100}
app.audio.lufs-warning-threshold=${AUDIO_LUFS_WARNING_THRESHOLD:-14.0}

# Délai minimum recommandé avant la date de sortie (avertissement non bloquant)
app.release.min-days-before-release=${RELEASE_MIN_DAYS:7}
