spring.application.name=music

# Base de données
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from.address=${MAIL_FROM_ADDRESS:noreply@musique-zig.com}
app.mail.from.name=${MAIL_FROM_NAME:Musique-Zig}

# URL
app.base-url=${APP_BASE_URL}
app.allowed-origin=${ALLOWED_ORIGIN}

# Admin par défaut
app.admin.email=${ADMIN_EMAIL:admin@musiquezig.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.fullname=${ADMIN_FULLNAME:Administrateur}
app.mail.from.name=${MAIL_FROM_NAME:Musique-Zig}